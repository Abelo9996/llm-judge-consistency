# Main experiment configuration
experiment:
  name: "llm-judge-consistency-v1"
  description: "Measuring scoring consistency and bias in LLM-based evaluation"

# Evaluation datasets
data:
  mt_bench_judgments: "data/mt_bench_pairs.json"    # 100 response pairs
  alpacaeval_samples: "data/alpacaeval_pairs.json"  # 100 response pairs

# Experiment 1: Intra-judge consistency
exp1_intra_judge:
  judges: ["gpt-4o-mini", "gpt-4.1-mini"]
  repeats: 50
  eval_formats: ["pairwise", "pointwise", "reference"]
  temperature: 1.0  # default, measuring natural variance
  samples: 100

# Experiment 2: Cross-judge agreement
exp2_cross_judge:
  judges: ["gpt-4o-mini", "gpt-4.1-mini"]
  repeats: 10  # fewer needed, comparing across judges
  eval_format: "pairwise"
  samples: 100

# Experiment 3: Bias × consistency interaction
exp3_bias:
  judges: ["gpt-4o-mini", "gpt-4.1-mini"]
  repeats: 30
  bias_conditions:
    - "position_swap"      # swap A/B order
    - "verbosity_augment"  # pad responses with filler
    - "self_preference"    # judge evaluates own model's outputs
  samples: 50

# Experiment 4: Evaluation format sensitivity
exp4_format:
  judges: ["gpt-4o-mini", "gpt-4.1-mini"]
  repeats: 30
  eval_formats: ["pointwise_1to10", "pointwise_1to5", "pairwise", "pairwise_with_tie", "reference_based"]
  samples: 50
