# Main experiment configuration — reflects what was actually run
experiment:
  name: "llm-judge-consistency-v1"
  description: "Measuring intra-judge consistency and bias in LLM-based evaluation"

# Evaluation dataset
data:
  eval_pairs: "data/eval_pairs.json"   # 29 response pairs, 10 categories
  response_a_model: "gpt-4o-mini"
  response_b_model: "gpt-4o"

# Experiment 1: Intra-judge consistency (main experiment)
exp1_intra_judge:
  judges: ["gpt-4o-mini", "gpt-4.1-mini"]
  repeats: 50
  eval_formats: ["pairwise", "pointwise"]
  temperature: 1.0
  samples: 29  # all eval_pairs

# Experiment 2: Temperature ablation
exp2_temperature:
  judges: ["gpt-4o-mini", "gpt-4.1-mini"]
  repeats: 10
  eval_format: "pairwise"
  temperature: 0.0
  samples: 29  # all eval_pairs

# Experiment 3: Prompt template sensitivity
exp3_prompt_sensitivity:
  judges: ["gpt-4o-mini", "gpt-4.1-mini"]
  repeats: 20
  eval_format: "pairwise"
  temperature: 1.0
  prompt_templates: ["prompt_A", "prompt_B"]
  samples: 10  # one per category

